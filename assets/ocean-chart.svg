<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1c28"/>
      <stop offset="45%" stop-color="#123243"/>
      <stop offset="100%" stop-color="#0b2230"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d7b56a" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="70%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#2b5a67" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2b5a67" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sea)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- Contours / currents -->
  <g fill="none" stroke="#e2c489" stroke-opacity=".18" stroke-width="1.4">
    <path d="M-20 220C180 160 320 280 520 210S860 120 1220 190"/>
    <path d="M-40 390C160 340 380 460 620 380S980 300 1240 360"/>
    <path d="M-30 560C200 500 420 620 680 540S1020 470 1240 540"/>
  </g>
  <!-- Island silhouettes (original abstract shapes) -->
  <g fill="#0e2734" stroke="#c9a45d" stroke-opacity=".35" stroke-width="1.2">
    <path d="M180 470c30-40 78-42 110-18 28 20 58 18 78-6 14 38 8 78-28 96-42 22-92 12-122-18-18-18-28-36-38-54z"/>
    <path d="M760 250c42-28 96-20 126 14 24 28 62 34 88 8 6 46-18 92-62 108-50 18-108 2-138-34-22-26-28-60-14-96z"/>
    <path d="M980 560c36-22 84-16 108 18 20 28 54 26 74 2 2 40-22 78-60 90-46 14-96 0-122-32-18-22-22-50 0-78z"/>
  </g>
  <!-- Dashed route -->
  <path d="M160 500C280 420 420 460 560 360S820 250 1040 420" fill="none" stroke="#f0d39a" stroke-opacity=".42" stroke-width="2" stroke-dasharray="10 12"/>
  <!-- X marks -->
  <g stroke="#e7c589" stroke-width="2.2" stroke-linecap="round" opacity=".55">
    <path d="M548 348l24 24M572 348l-24 24"/>
    <path d="M1030 408l18 18M1048 408l-18 18"/>
  </g>
  <!-- Compass rose watermark -->
  <g transform="translate(980 140) scale(.9)" opacity=".28" fill="#e8c988">
    <path d="M0-54 10-8 54 0 10 8 0 54-10 8-54 0-10-8Z"/>
    <circle r="8" fill="#0d2230" stroke="#e8c988" stroke-width="2"/>
  </g>
</svg>
