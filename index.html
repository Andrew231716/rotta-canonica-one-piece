<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#063b53" />
  <meta name="description" content="One Piece Canon Tracker: la tua rotta tra episodi canonici, filler e scene omesse dal live action." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rotta Canonica" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Rotta Canonica — One Piece Tracker</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>.weekly-releases{border:2px solid #c2a36e;border-radius:19px;background:#fff4d9;color:#433018;padding:20px;margin:0 0 24px;box-shadow:0 8px 0 #643f2040}.weekly-releases-head{display:flex;gap:12px;align-items:center}.weekly-releases-head img{width:54px;height:54px;object-fit:contain}.weekly-releases-head span{font-size:10px;font-weight:900;letter-spacing:1px;color:#9a6322}.weekly-releases-head h2{margin:2px 0;font-size:clamp(19px,4vw,26px);color:#53320c}.weekly-releases p{font-size:13px;line-height:1.5;margin:12px 0;color:#564226}.weekly-releases>small{display:block;color:#80684a;line-height:1.5;font-size:11px;margin-top:12px}.weekly-episode{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #c7aa7a;padding:11px 0}.weekly-episode div{min-width:0}.weekly-episode b{display:block;font-size:13px;line-height:1.4}.weekly-episode small{display:block;font-size:11px;color:#765d3f;margin-top:3px}.weekly-status{font-size:10px;text-align:center;font-weight:900;background:#f0ddac;border-radius:7px;padding:6px;white-space:normal;max-width:140px}.weekly-status.canon,.weekly-status.mixed{background:#bdebd1;color:#225d3d}.weekly-status.filler{background:#edb3aa;color:#752c21}@media(max-width:540px){.weekly-releases{padding:14px}.weekly-episode{align-items:flex-start}.weekly-status{flex:0 0 98px}}</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script defer src="/app.js"></script>
</body>
</html>
