name: Install original anime art assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/anime-artwork-pack.zip'
      - '.github/workflows/install-anime-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract original user-generated image pack
        run: |
          unzip -o assets/anime-artwork-pack.zip
          test -f assets/anime-icons/compass.webp
          test -f assets/anime-hero-portrait.webp
          test -f assets/anime-ocean-bg.webp
      - name: Save optimized webp images
        run: |
          git config user.name 'Rotta Canonica Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/anime-icons/ assets/anime-hero-portrait.webp assets/anime-ocean-bg.webp
          git rm -- assets/anime-artwork-pack.zip .github/workflows/install-anime-artwork.yml
          git commit -m 'assets: install original detailed anime icons and illustrated backgrounds'
          git push
