name: Aggiorna episodi One Piece
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-one-piece-episodes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Controlla episodi pubblicati
        run: node scripts/update-episodes.mjs
      - name: Registra nuove uscite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: aggiorna uscite settimanali One Piece"
            git push
          fi
