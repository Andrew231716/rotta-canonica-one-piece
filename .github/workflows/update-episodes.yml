name: Rotta Canonica - nuove puntate
on:
  workflow_dispatch:
  schedule:
    - cron: '5 9 * * 1'
permissions:
  contents: write
concurrency:
  group: latest-episodes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch aired episodes
        run: node scripts/update-episodes.mjs
      - name: Commit source-derived release catalog
        run: |
          if ! git diff --quiet -- data/episodes-latest.json; then
            git config user.name 'Rotta Canonica Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/episodes-latest.json
            git commit -m 'chore: update published episode feed'
            git push
          fi
