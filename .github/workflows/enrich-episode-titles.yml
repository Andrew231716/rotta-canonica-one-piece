name: Rotta Canonica - importa titoli episodio
on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-episodes.mjs'
      - 'scripts/enrich-italian-wiki.mjs'
      - 'scripts/merge-reviewed.mjs'
      - 'scripts/update-episodes.mjs'
      - '.github/workflows/enrich-episode-titles.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 1'
permissions:
  contents: write
concurrency:
  group: episode-metadata
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Import Italian titles, summaries and manga chapters
        run: node scripts/enrich-italian-wiki.mjs
      - name: Merge reviewed chapter/summary sources
        run: node scripts/merge-reviewed.mjs
      - name: Validate catalog and provenance
        run: node scripts/validate-data.mjs
      - name: Commit only if valid metadata changed
        run: |
          if ! git diff --quiet -- data/episodes.json data/episodes-latest.json; then
            git config user.name 'Rotta Canonica Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/episodes.json data/episodes-latest.json
            git commit -m 'chore: enrich Italian episode titles, synopses and manga mappings'
            git push
          fi
