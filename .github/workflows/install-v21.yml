name: Install illustrated Rotta Canonica v21
on:
  push:
    branches: [main]
    paths:
      - 'staging/rotta-v21-release.zip'
      - '.github/workflows/install-v21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install owner-approved illustrated source package and refresh checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          archive=Path('staging/rotta-v21-release.zip')
          allowed={'app.js','features.js','index.html','service-worker.js','anime-art-direction-v21.css','icon-192.png','icon-512.png','assets/anime-hero-portrait.webp','assets/anime-ocean-bg.webp'}
          with zipfile.ZipFile(archive) as z:
              entries=z.namelist()
              if len(entries)!=29:raise RuntimeError('Incomplete or unexpected visual release: '+str(len(entries)))
              for entry in entries:
                  q=PurePosixPath(entry)
                  if q.is_absolute() or '..' in q.parts or not (entry in allowed or entry.startswith('assets/anime-icons/') and entry.endswith('.webp')):raise RuntimeError('Unexpected entry '+entry)
                  target=Path(entry)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(entry))
          assert Path('assets/anime-icons/treasure.webp').is_file()
          assert Path('assets/anime-hero-portrait.webp').is_file()
          assert Path('anime-art-direction-v21.css').is_file()
          assert 'visual-style' in Path('features.js').read_text()
          assert 'anime-art-direction-v21.css' in Path('index.html').read_text()
          assert 'rotta-canonica-v21-anime-customizer' in Path('service-worker.js').read_text()
          # v21 is already present in the repository: retain its more thorough current tests.
          check=Path('scripts/check-ui-assets.mjs').read_text()
          test=Path('tests/test_security_offline.cjs').read_text()
          if 'rotta-canonica-v21-anime-customizer' not in check or 'animeCss' not in check:raise RuntimeError('v21 visual checks are absent')
          if 'rotta-canonica-v21-anime-customizer' not in test or 'service-worker\\.js\\?v=21anime' not in test:raise RuntimeError('v21 security checks are absent')
          print('Imported',len(entries),'illustrated source files with cache and security checks')
          PY
      - name: Check app, catalog, local auth and illustrated assets
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check features.js
          node --check service-worker.js
          node scripts/validate-data.mjs --allow-empty
          node scripts/check-ui-assets.mjs
          node tests/test_security_offline.cjs
      - name: Publish all updated illustrated app files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rotta Canonica Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js features.js index.html service-worker.js anime-art-direction-v21.css icon-192.png icon-512.png assets/anime-icons/ assets/anime-hero-portrait.webp assets/anime-ocean-bg.webp scripts/check-ui-assets.mjs tests/test_security_offline.cjs
          git rm -f staging/rotta-v21-release.zip .github/workflows/install-v21.yml
          git commit -m "feat(ui): publish owner-created illustrated anime visuals, animations and in-app appearance editor"
          git push
